<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>QG Famille</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="QG Famille">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F7F4EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Une colonne façon appli, grandes cartes pastel, barre d'onglets noire flottante.
   Bleu, orange et rose sont réservés aux enfants : Milan, Lyssia, Naelia.
   Les rubriques utilisent jaune, lavande et vert sauge pour ne jamais se confondre avec eux. */
:root {
  --bg: #F7F4EF; --surface: #FFFFFF; --ink: #161616; --muted: #6B6660; --line: #E9E3DA;
  --nav: #161616; --nav-ink: #FFFFFF; --btn: #161616; --btn-ink: #FFFFFF;
  --yellow: #FFE98A; --lav: #DED8FF; --sage: #D3E8C6; --sand: #EFE8DD;
  --milan: #2F6FEB; --milan-bg: #D6E4FF;
  --lyssia: #EE7418; --lyssia-bg: #FFDDBF;
  --naelia: #DE4A8C; --naelia-bg: #FFD4E6;
  --famille: #6B6660; --famille-bg: #EFE8DD;
  --ok: #2E8A57; --warn: #B98500; --hot: #D23A2A; --hot-bg: #FFDCD6;
  --shadow: 0 14px 34px rgba(22, 22, 22, .18);
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 24px; --r-sm: 16px; color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121212; --surface: #1E1D1B; --ink: #F3EFE9; --muted: #A39D95; --line: #2E2B28;
    --nav: #F3EFE9; --nav-ink: #161616; --btn: #F3EFE9; --btn-ink: #161616;
    --yellow: #4A421E; --lav: #312C55; --sage: #26391F; --sand: #2B2825;
    --milan: #85ACFF; --milan-bg: #1E2E50;
    --lyssia: #FFA05A; --lyssia-bg: #4C2D14;
    --naelia: #FF89BC; --naelia-bg: #4B1E33;
    --famille: #A39D95; --famille-bg: #2B2825;
    --ok: #5CCB8C; --warn: #E8B83E; --hot: #FF7563; --hot-bg: #4A1E19;
    --shadow: 0 14px 34px rgba(0, 0, 0, .55); color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: env(safe-area-inset-top, 0px); -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased;
}
[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.wrap { max-width: 560px; margin: 0 auto; padding-block: 18px calc(120px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 18px; }

/* En-tête */
.top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.hello { margin: 0; }
.hello small { display: block; font-size: 15px; color: var(--muted); font-weight: 500; }
.hello b { display: block; font-family: var(--f-display); font-weight: 800; font-size: 34px; line-height: 1.05; letter-spacing: -.02em; }
.avatar { width: 44px; height: 44px; border-radius: 50%; border: 0; display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; font-size: 18px; flex: none; background: var(--lav); color: var(--ink); }

h2 { font-family: var(--f-display); font-weight: 800; font-size: 22px; letter-spacing: -.01em; margin: 0; text-wrap: balance; }
h3 { font-family: var(--f-display); font-weight: 700; font-size: 14px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 0; }
.sec { display: flex; flex-direction: column; gap: 10px; }
.sec-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.link { background: none; border: 0; color: var(--ink); font-weight: 700; padding: 4px 0; font-size: 15px; text-decoration: underline; text-underline-offset: 3px; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.empty { color: var(--muted); font-size: 15px; padding: 16px; border: 1.5px dashed var(--line); border-radius: var(--r-sm); margin: 0; }

/* Cartes pastel */
.card { border-radius: var(--r); padding: 18px; display: flex; flex-direction: column; gap: 10px; }
.c-yellow { background: var(--yellow); } .c-lav { background: var(--lav); } .c-sage { background: var(--sage); } .c-sand { background: var(--sand); }
.c-white { background: var(--surface); border: 1px solid var(--line); }
.big { font-family: var(--f-display); font-weight: 800; font-size: 27px; line-height: 1.08; letter-spacing: -.02em; margin: 0; text-wrap: balance; }

/* Enfants */
.k-milan { --k: var(--milan); --kbg: var(--milan-bg); }
.k-lyssia { --k: var(--lyssia); --kbg: var(--lyssia-bg); }
.k-naelia { --k: var(--naelia); --kbg: var(--naelia-bg); }
.k-famille { --k: var(--famille); --kbg: var(--famille-bg); }
.kid { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 700; padding: 2px 9px 2px 7px; border-radius: 999px; background: var(--kbg); color: var(--ink); white-space: nowrap; }
.kid::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--k); }
.kids { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.kidcard { background: var(--kbg); border: 0; border-radius: 20px; padding: 14px 12px; text-align: left; display: flex; flex-direction: column; gap: 6px; min-height: 120px; min-width: 0; }
.kidcard b { font-family: var(--f-display); font-weight: 800; font-size: 19px; display: flex; align-items: center; gap: 7px; }
.kidcard b::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--k); flex: none; }
.kidcard span { font-size: 13.5px; line-height: 1.3; overflow-wrap: anywhere; }
.kidcard .n { font-family: var(--f-display); font-weight: 800; font-size: 22px; margin-top: auto; }

/* Garde */
.garde { border-radius: var(--r); padding: 20px; display: flex; flex-direction: column; gap: 8px; background: var(--lyssia-bg); position: relative; overflow: hidden; }
.garde.sans { background: var(--surface); border: 1.5px dashed var(--lyssia); }
.garde .tagline { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--lyssia); margin: 0; }
.garde.avec::after { content: ""; position: absolute; right: -36px; top: -36px; width: 130px; height: 130px; border-radius: 50%; background: var(--lyssia); opacity: .22; }
.garde p { margin: 0; }
.pill { display: inline-flex; align-items: center; font-size: 13px; font-weight: 700; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
.pill.avec { background: var(--lyssia); color: #fff; }
.pill.sans { background: var(--sand); color: var(--muted); }

/* Listes */
.list { list-style: none; margin: 0; padding: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.row { display: flex; align-items: center; gap: 12px; padding: 10px; min-height: 56px; border-radius: 16px; }
.row + .row { border-top: 1px solid var(--line); border-radius: 0 0 16px 16px; }
.row .grow { flex: 1; min-width: 0; }
.row .t { font-weight: 700; overflow-wrap: anywhere; }
.row .m { font-size: 14px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; margin-top: 2px; }
.row button.grow { background: none; border: 0; text-align: left; padding: 0; }
.bubble { width: 50px; min-height: 46px; border-radius: 14px; background: var(--kbg, var(--lav)); display: grid; place-items: center; text-align: center; font-family: var(--f-display); font-weight: 800; font-size: 14px; line-height: 1.05; flex: none; padding: 4px; }
.bubble.tard { background: #2A2350; color: #FFE98A; }
/* Infos pratiques, frais, animaux */
.info { display: flex; gap: 12px; align-items: flex-start; padding: 12px; }
.info + .info { border-top: 1px solid var(--line); }
.info .lib { font-size: 13px; font-weight: 700; color: var(--muted); }
.info .val { font-weight: 700; font-size: 17px; overflow-wrap: anywhere; white-space: pre-line; font-variant-numeric: tabular-nums; }
.info .val a { color: inherit; }
.info .val.masque { letter-spacing: .2em; color: var(--muted); }
.mini { border: 0; background: var(--sand); color: var(--ink); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 700; white-space: nowrap; }
.sugg { display: flex; flex-wrap: wrap; gap: 6px; }
.sugg button { border: 1.5px dashed var(--line); background: transparent; border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600; color: var(--muted); }
.solde { font-family: var(--f-display); font-weight: 800; font-size: 34px; line-height: 1.05; letter-spacing: -.02em; margin: 0; font-variant-numeric: tabular-nums; }
.euro { font-family: var(--f-display); font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; font-size: 17px; }
.regle { opacity: .55; }
.pet { display: flex; gap: 14px; align-items: center; border: 0; text-align: left; border-radius: var(--r); padding: 16px; width: 100%; color: var(--ink); }
.pet .ava { width: 56px; height: 56px; border-radius: 18px; background: rgba(255,255,255,.65); display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; font-size: 24px; flex: none; }
@media (prefers-color-scheme: dark) { .pet .ava { background: rgba(0,0,0,.25); } }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 0; font-size: 15px; }
.kv dt { color: var(--muted); font-weight: 600; }
.kv dd { margin: 0; font-weight: 700; overflow-wrap: anywhere; }
.taille { border: 0; border-radius: 20px; padding: 12px; text-align: left; background: var(--kbg); color: var(--ink); display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.taille b { font-family: var(--f-display); font-weight: 800; font-size: 17px; display: flex; align-items: center; gap: 6px; }
.taille b::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--k); }
.taille span { font-size: 13.5px; }
.taille .warn { color: var(--hot); font-weight: 700; }
.tard-card { background: #2A2350; color: #FFFFFF; position: relative; overflow: hidden; }
.tard-card::after { content: ""; position: absolute; right: 18px; top: 16px; width: 58px; height: 58px; border-radius: 50%; background: radial-gradient(circle at 28% 36%, #2A2350 0 46%, #FFE98A 47%); }
.tard-card > * { position: relative; z-index: 1; }
.tard-card .tagline { color: #FFE98A; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; margin: 0; }
.tard-card .consignes { background: rgba(255,255,255,.1); border-radius: 14px; padding: 10px 12px; margin: 0; white-space: pre-line; }
.bubble.psg, .psg-tag { background: #10264A; color: #FFFFFF; }
.psg-tag { font-weight: 800; letter-spacing: .04em; }
.psg-hero, .tile.psg-hero { background: #10264A; color: #FFFFFF; position: relative; overflow: hidden; padding-right: 52px; }
.psg-hero::after { content: ""; position: absolute; right: 16px; top: 0; bottom: 0; width: 22px; background: #DA2128; }
.psg-hero > * { position: relative; z-index: 1; }
.when { font-size: 14px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.when.late { color: var(--hot); font-weight: 700; }
.qui { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
.tick { width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--k, var(--line)); background: transparent; flex: none; display: grid; place-items: center; padding: 0; }
.tick.on { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.tick svg { width: 16px; height: 16px; }
.day { font-family: var(--f-display); font-size: 14px; font-weight: 700; color: var(--muted); padding: 12px 10px 2px; list-style: none; }
.day.today { color: var(--ink); }
.btn { border: 0; background: var(--btn); color: var(--btn-ink); font-weight: 700; padding: 12px 20px; border-radius: 999px; font-size: 15px; display: inline-flex; align-items: center; gap: 8px; }
.btn.sm { padding: 8px 14px; font-size: 14px; }
.btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--ink); }
.btn.soft { background: rgba(255,255,255,.55); color: var(--ink); }
.btn.danger { background: transparent; color: var(--hot); border: 1.5px solid var(--hot); }
.btn:disabled { opacity: .5; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }

.week { display: flex; flex-direction: column; gap: 8px; }
.week-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 0 4px; }
.week-head b { font-family: var(--f-display); font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums; }

/* Filtres et onglets */
.seg { display: flex; background: var(--sand); border-radius: 999px; padding: 4px; gap: 4px; }
.seg button { flex: 1; border: 0; background: transparent; padding: 9px 6px; border-radius: 999px; font-weight: 700; font-size: 15px; color: var(--muted); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--btn); color: var(--btn-ink); }
.seg .n { font-weight: 500; opacity: .75; font-variant-numeric: tabular-nums; }
.filters { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.filters::-webkit-scrollbar { display: none; }
.filters button { border: 0; border-radius: 999px; padding: 8px 14px; font-weight: 700; font-size: 14px; background: var(--kbg, var(--sand)); white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.filters button.k-milan::before, .filters button.k-lyssia::before, .filters button.k-naelia::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--k); }
.filters button[aria-pressed="true"] { background: var(--btn); color: var(--btn-ink); }

/* Formulaires */
.quick { display: flex; gap: 8px; }
.quick input { flex: 1; min-width: 0; }
input[type="text"], input[type="url"], input[type="date"], input[type="time"], input[type="number"], input[type="email"], input[type="password"], select, textarea {
  width: 100%; border: 1.5px solid var(--line); background: var(--surface); border-radius: 14px; padding: 12px 14px; font-size: 16px; min-width: 0;
}
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--ink); }
input[type="date"], input[type="time"] { min-height: 48px; }
textarea { min-height: 90px; resize: vertical; }
label.f, .f { display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 700; color: var(--muted); }
.form { display: flex; flex-direction: column; gap: 14px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips label { position: relative; }
.chips input { position: absolute; opacity: 0; inset: 0; }
.chips span { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); font-size: 15px; color: var(--ink); font-weight: 600; }
.chips label[class*="k-"] span { background: var(--kbg); border-color: transparent; }
.chips label[class*="k-"] span::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--k); }
.chips input:checked + span { background: var(--btn); border-color: var(--btn); color: var(--btn-ink); }
.chips input:focus-visible + span { outline: 2px solid var(--ink); outline-offset: 2px; }

/* Tuiles */
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { border: 0; border-radius: var(--r); padding: 16px; text-align: left; display: flex; flex-direction: column; gap: 4px; min-height: 124px; color: var(--ink); }
.tile b { font-family: var(--f-display); font-size: 20px; font-weight: 800; line-height: 1.1; }
.tile .s { font-size: 14px; margin-top: auto; }
.tile.soon { background: transparent; border: 1.5px dashed var(--line); cursor: default; min-height: 90px; }
.tag { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--sand); color: var(--muted); }
.notice { background: var(--yellow); border-radius: 16px; padding: 12px 16px; font-size: 14px; }

/* Saisie en vrac */
.vrac { background: var(--yellow); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.vrac .lbl { font-family: var(--f-display); font-weight: 800; font-size: 20px; margin: 0; }
.vrac textarea { min-height: 52px; height: 52px; border: 0; padding: 12px 14px; background: rgba(255,255,255,.7); border-radius: 16px; resize: none; font-size: 17px; }
@media (prefers-color-scheme: dark) { .vrac textarea, .btn.soft { background: rgba(0,0,0,.28); } }
.vrac-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.prop { background: rgba(255,255,255,.6); border-radius: 16px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
@media (prefers-color-scheme: dark) { .prop { background: rgba(0,0,0,.25); } }
.prop-top { display: flex; align-items: center; gap: 8px; }
.prop-top select { width: auto; padding: 7px 8px; font-size: 14px; font-weight: 700; border-radius: 10px; }
.prop-top input { flex: 1; padding: 8px 10px; border-radius: 10px; }
.prop .two input { padding: 8px 10px; border-radius: 10px; }
.prop .chips span { padding: 5px 11px; font-size: 14px; }

/* Voiture */
.lvl-ok { --lv: var(--ok); --lvbg: var(--sage); } .lvl-warn { --lv: var(--warn); --lvbg: var(--yellow); } .lvl-hot { --lv: var(--hot); --lvbg: var(--hot-bg); } .lvl-none { --lv: var(--muted); --lvbg: var(--sand); }
.status { background: var(--lvbg); }
.status .verdict { font-family: var(--f-display); font-weight: 800; font-size: 36px; line-height: 1; letter-spacing: -.02em; margin: 0; }
.gauge { position: relative; height: 34px; border-radius: 999px; background: rgba(255,255,255,.65); overflow: hidden; }
@media (prefers-color-scheme: dark) { .gauge { background: rgba(0,0,0,.3); } }
.gauge .fp { position: absolute; left: 0; top: 0; bottom: 0; background: var(--lv); opacity: .35; border-radius: 999px; }
.gauge .fu { position: absolute; left: 0; top: 0; bottom: 0; background: var(--ink); border-radius: 999px; }
.gauge .cap { position: absolute; top: 0; bottom: 0; width: 3px; background: var(--hot); }
.gauge .tk { position: absolute; top: 4px; bottom: 4px; width: 3px; margin-left: -1.5px; background: var(--bg); border-radius: 2px; }
.legend { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13.5px; }
.legend li { display: flex; align-items: center; gap: 6px; }
.sw { width: 12px; height: 12px; border-radius: 4px; flex: none; }
.figs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.fig { background: var(--surface); border-radius: 18px; padding: 12px 14px; }
.fig .v { font-family: var(--f-display); font-weight: 800; font-size: 24px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.fig .l { color: var(--muted); font-size: 13px; line-height: 1.3; margin-top: 2px; }
.fig .s { font-size: 13px; margin-top: 2px; font-weight: 700; }
.chart { width: 100%; height: auto; display: block; }
.chart text { font-family: var(--f-body); font-size: 11px; fill: var(--muted); }
.ybar { display: block; height: 12px; border-radius: 6px; background: var(--sand); position: relative; overflow: hidden; }
.ybar span { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 6px; }
details summary { cursor: pointer; font-family: var(--f-display); font-weight: 800; font-size: 18px; list-style: none; }
details summary::-webkit-details-marker { display: none; }
details summary::after { content: "+"; float: right; color: var(--muted); }
details[open] summary::after { content: "–"; }
.msg { margin: 0; font-size: 14px; min-height: 1.2em; }
.msg.err { color: var(--hot); } .msg.ok { color: var(--ok); }

/* Envies */
.envie { display: flex; gap: 12px; align-items: flex-start; padding: 12px; }
.envie + .envie { border-top: 1px solid var(--line); }
.envie .ico { width: 44px; height: 44px; border-radius: 14px; background: var(--kbg, var(--yellow)); display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; font-size: 18px; flex: none; text-transform: uppercase; }
.envie a { color: inherit; text-decoration: none; }
.envie a:hover { text-decoration: underline; }
.price { font-family: var(--f-display); font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }

/* Connexion */
.login { max-width: 400px; margin: 8vh auto 0; display: flex; flex-direction: column; gap: 18px; }
.login .hero { background: var(--yellow); border-radius: var(--r); padding: 26px 22px; position: relative; overflow: hidden; }

  const keep = a && a.id && main.contains(a) && "value" in a ? { id: a.id, v: a.value, s: a.selectionStart } : null;
  $("#date-line").textContent = fmtLong(today()).replace(/^./, (c) => c.toUpperCase());
  $("#hello-name").textContent = `Bonjour ${qui()}`;
  const av = $("#avatar"); av.textContent = qui().slice(0, 1); av.style.background = qui() === "Medhi" ? "var(--sage)" : "var(--lav)";
  document.querySelectorAll(".tabs button[data-v]").forEach((b) => b.setAttribute("aria-current", b.dataset.v === S.view && !S.sub ? "page" : "false"));
  $("#vrac-box").hidden = !(S.view === "accueil" && !S.sub);
  renderStatus();
  main.innerHTML = (VIEWS[S.sub ? S.sub.type : S.view] || VIEWS.accueil)();
  if (keep) { const n = document.getElementById(keep.id); if (n) { n.value = keep.v; n.focus(); try { n.setSelectionRange(keep.s, keep.s); } catch {} } }
}
function renderStatus() {
  const el = $("#status");
  const msg = S.offline ? "Pas de réseau : tes ajouts sont gardés sur ce téléphone et partiront dès le retour du réseau." : "";
  el.hidden = !msg; el.textContent = msg;
}
const loading = (k) => !S.loaded.has(k);
const filtresKids = (actif, act = "kid") => `<div class="filters" role="group" aria-label="Filtrer par enfant">
  <button data-act="${act}" data-k="" aria-pressed="${!actif}">Tous</button>
  ${ENFANTS.map((e) => `<button class="${e.cls}" data-act="${act}" data-k="${e.nom}" aria-pressed="${actif === e.nom}">${e.nom}</button>`).join("")}
  ${act === "kid" ? `<button data-act="${act}" data-k="famille" aria-pressed="${actif === "famille"}">Famille</button>` : ""}</div>`;

const VIEWS = {
  accueil() {
    const t = today(); const lun = mondayOf(t);
    const out = [gardeBanner(lun)];
    const sac = sacLyssia();
    const passToday = passageLe(t), passTomorrow = passageLe(addDays(t, 1));
    if (passToday || passTomorrow) {
      const s = statutSemaine(passToday ? t : addDays(t, 1));
      out.push(`<section class="card c-white k-lyssia"><p style="margin:0"><b>${passToday ? "Aujourd'hui" : "Demain"} à ${heurePassage()}</b> : Lyssia ${s && s.avec ? "arrive" : "repart chez son autre parent"}.</p>
        ${sac ? `<div class="actions"><button class="btn sm" data-act="open-check" data-id="${sac.id}">Préparer le sac (${(sac.items || []).filter((i) => i.ok).length}/${(sac.items || []).length})</button></div>` : ""}</section>`);
    }
    // Poubelles à sortir ce soir
    for (const c of COLLECTES.filter((x) => addDays(x.d, -1) === t)) {
      const so = SORTES[c.s], f = pbFaite(c);
      out.push(`<section class="card" style="background:${so.couleur};color:${so.texte}"><p style="margin:0;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.07em">Ce soir</p>
        <p class="big">${f ? `${so.nom} sortie ✓` : `Sortir la ${so.nom.toLowerCase()}`}</p>
        <p style="margin:0">${so.detail} · collecte demain ${so.moment}${f && f.par ? ` · sortie par ${esc(f.par)}` : ""}.</p>
        <div class="actions"><button class="btn sm" style="background:${so.texte};color:${so.couleur}" data-act="poubelle" data-c="${c.d}" data-s="${c.s}">${f ? "Annuler" : "C'est sorti"}</button></div></section>`);
    }
    if (!COLLECTES.some((c) => c.d >= t)) out.push(`<section class="card c-sand"><p style="margin:0"><b>Calendrier des poubelles terminé.</b> Envoie la photo du calendrier ${parse(t).getFullYear()} à Claude pour l'ajouter.</p></section>`);
    // Soirée où l'un rentre tard : l'autre couche les enfants
    for (const e of S.events.filter((x) => x.type === "tard" && (x.date === t || (x.date === addDays(t, 1) && new Date().getHours() >= 18)))) {
      const autre = coucheur(e);
      out.push(`<section class="card tard-card"><p class="tagline">${e.date === t ? "Ce soir" : "Demain soir"}</p>
        <p class="big" style="padding-right:70px">${esc(autre)} couche les enfants</p>
        <p style="margin:0">${esc(e.qui)} rentre tard${e.heure ? `, vers ${fmtH(e.heure)}` : ""}.</p>
        ${e.note ? `<p class="consignes">${esc(e.note)}</p>` : ""}
        <div class="actions"><button class="btn sm soft" style="color:#fff;background:rgba(255,255,255,.16)" data-act="form" data-type="tard" data-id="${e.id}">Modifier</button></div></section>`);
    }
    // Les trois enfants
    out.push(`<section class="kids">${ENFANTS.map((e) => {
      const ev = S.events.filter((x) => x.date >= t && pourDe(x).includes(e.nom)).sort((a, b) => (a.date + (a.heure || "")).localeCompare(b.date + (b.heure || "")));
      const rp = rappelsActifs().filter((r) => pourDe(r).includes(e.nom));
      const next = [...ev.map((x) => ({ d: x.date, h: x.heure, t: x.titre })), ...rp.map((r) => ({ d: r.prochaine, h: "", t: r.titre }))].sort((a, b) => (a.d + (a.h || "")).localeCompare(b.d + (b.h || "")))[0];
      const n = ev.filter((x) => x.date <= addDays(t, 7)).length + rp.filter((r) => r.prochaine <= addDays(t, 7)).length;
      return `<button class="kidcard ${e.cls}" data-act="kid-agenda" data-k="${e.nom}"><b>${e.nom}</b>
        <span>${next ? `${esc(next.t)}<br><span class="muted">${rel(next.d)}${next.h ? " · " + fmtH(next.h) : ""}</span>` : '<span class="muted">Rien de prévu</span>'}</span>
        <span class="n">${n}<span class="small muted" style="font-family:var(--f-body);font-weight:500"> cette sem.</span></span></button>`;
    }).join("")}</section>`);
    // Aujourd'hui
    const dus = rappelsActifs().filter((r) => r.prochaine <= t);
    const rout = S.routines.filter((r) => routineDue(r, t));
    let todo = evtsDu(t).map(eventRow).join("");
    for (const r of dus) todo += rappelRow(r);
    for (const r of rout) todo += routineRow(r, t);
    out.push(`<section class="sec"><div class="sec-head"><h2>Aujourd'hui</h2></div>
      ${loading("rappels") ? '<p class="muted">Chargement…</p>' : todo ? `<ul class="list">${todo}</ul>` : '<p class="empty">Rien de prévu aujourd\'hui.</p>'}</section>`);
    // 7 jours
    let week = "";
    for (let i = 1; i <= 7; i++) {
      const d = addDays(t, i); const ev = evtsDu(d); const rp = rappelsActifs().filter((r) => r.prochaine === d);
      if (!ev.length && !rp.length && !passageLe(d)) continue;
      week += `<li class="day">${i === 1 ? "Demain" : fmt(d)}${passageLe(d) ? ` · passage de Lyssia ${heurePassage()}` : ""}</li>` + ev.map(eventRow).join("") + rp.map(rappelRow).join("");
    }
    out.push(`<section class="sec"><div class="sec-head"><h2>Les 7 prochains jours</h2><button class="link" data-act="tab" data-v="agenda">Agenda</button></div>
      ${week ? `<ul class="list">${week}</ul>` : '<p class="empty">Aucun rendez-vous ni rappel dans les 7 prochains jours.</p>'}</section>`);
    // Croquettes à racheter bientôt
    for (const a of S.animaux) {
      const c = croquettes(a);
      if (c && c.jours <= 5) out.push(`<section class="card c-yellow"><p style="margin:0"><b>Croquettes de ${esc(a.nom)}</b> : ${c.jours < 0 ? `le sac devait être fini il y a ${-c.jours} j` : c.jours === 0 ? "le sac devrait être fini aujourd'hui" : `plus que ${c.jours} jour${c.jours > 1 ? "s" : ""} environ`}.</p>
        <div class="actions"><button class="btn sm" data-act="animal-courses" data-id="${a.id}">Ajouter aux courses</button><button class="btn sm ghost" data-act="animal-sac" data-id="${a.id}">Sac acheté</button></div></section>`);
    }
    // À faire
    const taf = tachesOuvertes();
    out.push(`<section class="card c-sand"><div class="sec-head"><h2>À faire · ${taf.length}</h2><button class="link" data-act="go-taches">Tout voir</button></div>
      ${taf.length ? `<ul class="list">${taf.slice(0, 4).map(tacheRow).join("")}</ul>${taf.length > 4 ? `<p class="small" style="margin:0">et ${taf.length - 4} autres</p>` : ""}` : '<p style="margin:0">Rien en attente. Écris « lancer la machine » ou « récupérer le colis Vinted » dans « Note tout ici ».</p>'}</section>`);
    // Courses
    const urg = S.courses.filter((c) => c.liste === "urgent");
    out.push(`<section class="card c-sage"><div class="sec-head"><h2>Courses urgentes · ${urg.length}</h2><button class="link" data-act="tab" data-v="courses">Tout voir</button></div>
      ${urg.length ? `<ul class="list">${urg.slice(0, 5).map(courseRow).join("")}</ul>${urg.length > 5 ? `<p class="small" style="margin:0">et ${urg.length - 5} autres</p>` : ""}` : '<p style="margin:0">Rien à acheter en urgence.</p>'}</section>`);
    return `<div class="sec" style="gap:20px">${out.join("")}</div>`;
  },

  agenda() {
    const t = today(); const lun0 = mondayOf(t);
    let html = `<div class="sec-head"><h2>Agenda</h2><button class="link" data-act="sub" data-type="garde">Garde de Lyssia</button></div>${filtresKids(S.kid)}`;
    for (let w = 0; w < 10; w++) {
      const m = addDays(lun0, 7 * w), dim = addDays(m, 6), s = statutSemaine(m);
      const dm = parse(m), dd = parse(dim);
      const label = dm.getMonth() === dd.getMonth() ? `${dm.getDate()} – ${dd.getDate()} ${MC[dd.getMonth()]}` : `${dm.getDate()} ${MC[dm.getMonth()]} – ${dd.getDate()} ${MC[dd.getMonth()]}`;
      let days = "";
      for (let i = 0; i < 7; i++) {
        const d = addDays(m, i); if (d < t) continue;
        const ev = evtsDu(d);
        const rp = rappelsActifs().filter((r) => (r.prochaine === d || (d === t && r.prochaine < t)) && filtreKid(r));
        const pass = passageLe(d) && (!S.kid || S.kid === "Lyssia");
        if (!ev.length && !rp.length && !pass && d !== t) continue;
        days += `<li class="day ${d === t ? "today" : ""}">${d === t ? "Aujourd'hui" : fmt(d)}${pass ? ` · passage de Lyssia ${heurePassage()}` : ""}</li>`;
        days += ev.map(eventRow).join("") + rp.map(rappelRow).join("");
        if (!ev.length && !rp.length) days += `<li class="row"><span class="muted small">Rien de prévu</span></li>`;
      }
      html += `<section class="week"><div class="week-head"><b>${label}</b>${s ? `<span class="pill ${s.avec ? "avec" : "sans"}">${s.avec ? "Avec Lyssia" : "Sans Lyssia"}</span>` : ""}</div>
        ${days ? `<ul class="list">${days}</ul>` : ""}</section>`;
    }
    return `<div class="sec" style="gap:16px">${html}<div class="actions"><button class="btn" data-act="form" data-type="event">Ajouter un événement</button></div></div>`;
  },

  courses() {
    const tab = S.courseTab;
    const items = S.courses.filter((c) => c.liste === tab).sort((a, b) => (a.cree || "").localeCompare(b.cree || ""));
    const n = (k) => S.courses.filter((c) => c.liste === k).length;
    const ph = { urgent: "Ex. lait, piles, croquettes", constate: "Ce qui va bientôt manquer", unjour: "Ex. nouvelle poêle" }[tab];
    return `<div class="sec" style="gap:14px">
      <h2>Courses</h2>
      <div class="seg" role="group">${Object.entries(LISTES).map(([k, v]) => `<button data-act="course-tab" data-k="${k}" aria-pressed="${k === tab}">${v} <span class="n">${n(k)}</span></button>`).join("")}</div>
      <form class="quick" data-form="quick-course" autocomplete="off">
        <input type="text" id="qc-nom" name="nom" placeholder="${ph}" list="freq" aria-label="Article à ajouter" enterkeyhint="done">
        <button class="btn" type="submit">Ajouter</button>
      </form>
      <datalist id="freq">${S.frequents.map((f) => `<option value="${esc(f)}">`).join("")}</datalist>
      ${loading("courses") ? '<p class="muted">Chargement…</p>' : items.length ? `<ul class="list">${items.map(courseRow).join("")}</ul>` : `<p class="empty">${{ urgent: "Liste vide. Ajoute ce qu'il faut acheter à la prochaine course.", constate: "Note ici ce que tu vois baisser, au fil de l'eau.", unjour: "Les achats qui peuvent attendre." }[tab]}</p>`}
      ${tab === "constate" && items.length ? `<div class="actions"><button class="btn ghost" data-act="go-shopping">Je pars faire les courses : tout passer en Urgent</button></div>` : ""}
      ${tab === "urgent" && items.length ? `<p class="muted small" style="margin:0">Coche un article une fois acheté : il disparaît de la liste.</p>` : ""}
    </div>`;
  },

  rappels() {
    const t = today();
    const seg = `<div class="seg" role="group"><button data-act="rap-tab" data-k="taches" aria-pressed="${S.rapTab === "taches"}">À faire <span class="n">${tachesOuvertes().length}</span></button><button data-act="rap-tab" data-k="rappels" aria-pressed="${S.rapTab === "rappels"}">Rappels</button><button data-act="rap-tab" data-k="routines" aria-pressed="${S.rapTab === "routines"}">Routines</button></div>`;
    if (S.rapTab === "taches") {
      const ouv = tachesOuvertes(), faites = S.taches.filter((x) => x.fait).sort((a, b) => (b.faitLe || "").localeCompare(a.faitLe || "")).slice(0, 15);
      const parQui = (q) => ouv.filter((x) => (x.qui || "Les deux") === q);
      return `<div class="sec" style="gap:14px"><h2>À faire</h2>${seg}
        <form class="quick" data-form="quick-tache" autocomplete="off"><input type="text" id="qt-titre" name="titre" placeholder="Ex. lancer la machine, rideau chambre Milan" aria-label="Nouvelle tâche" enterkeyhint="done"><button class="btn" type="submit">Ajouter</button></form>
        ${ouv.length ? ["Chloé", "Medhi", "Les deux"].map((q) => parQui(q).length ? `<div class="sec"><h3>${q === "Les deux" ? "Pour qui veut" : q} · ${parQui(q).length}</h3><ul class="list">${parQui(q).map(tacheRow).join("")}</ul></div>` : "").join("") : '<p class="empty">Rien en attente. Les tâches sans date (machine, colis à récupérer, petites réparations) arrivent ici.</p>'}
        ${faites.length ? `<button class="link" data-act="taches-faites">${S.tachesFaites ? "Masquer" : "Afficher"} ce qui a été fait récemment</button>${S.tachesFaites ? `<ul class="list regle">${faites.map(tacheRow).join("")}</ul>` : ""}` : ""}</div>`;
    }
    if (S.rapTab === "routines") {
      const list = S.routines.slice().sort((a, b) => (a.nom || "").localeCompare(b.nom || ""));
      return `<div class="sec" style="gap:14px"><h2>Rappels</h2>${seg}
        ${list.length ? `<ul class="list">${list.map((r) => routineRow(r, t, true)).join("")}</ul>` : '<p class="empty">Aucune routine. Exemple : poubelles le mardi soir, litière, draps.</p>'}
        <div class="actions"><button class="btn" data-act="form" data-type="routine">Nouvelle routine</button></div></div>`;
    }
    const act = rappelsActifs().filter(filtreKid); const in7 = addDays(t, 7);
    const groups = [
      ["En retard", act.filter((r) => r.prochaine < t)],
      ["Aujourd'hui", act.filter((r) => r.prochaine === t)],
      ["7 prochains jours", act.filter((r) => r.prochaine > t && r.prochaine <= in7)],
      ["Plus tard", act.filter((r) => r.prochaine > in7)],
    ].filter(([, l]) => l.length);
    return `<div class="sec" style="gap:14px"><h2>Rappels</h2>${seg}${filtresKids(S.kid)}
      ${loading("rappels") ? '<p class="muted">Chargement…</p>' : groups.length ? groups.map(([h, l]) => `<div class="sec"><h3>${h}</h3><ul class="list">${l.map(rappelRow).join("")}</ul></div>`).join("") : '<p class="empty">Aucun rappel. Exemple : collier antiparasitaire des chats tous les 8 mois, vaccin de Naelia, contrôle technique.</p>'}
      <div class="actions"><button class="btn" data-act="form" data-type="rappel">Nouveau rappel</button></div></div>`;
  },

  envies() {
    const tab = S.envieTab;
    const order = (l) => STATUTS.indexOf(l.statut || "À voir");
    const genre = (l) => l.genre || "idee";
    const list = S.liens.filter((l) => genre(l) === tab && (!S.envieKid || pourDe(l).includes(S.envieKid)))
      .sort((a, b) => order(a) - order(b) || (b.cree || "").localeCompare(a.cree || ""));
    const n = (g) => S.liens.filter((l) => genre(l) === g && l.statut !== "Abandonné" && l.statut !== "Validé").length;
    return `<div class="sec" style="gap:14px">
      <h2>Envies et idées</h2>
      <div class="seg" role="group"><button data-act="envie-tab" data-k="achat" aria-pressed="${tab === "achat"}">Achats <span class="n">${n("achat")}</span></button><button data-act="envie-tab" data-k="idee" aria-pressed="${tab === "idee"}">Idées pour plus tard <span class="n">${n("idee")}</span></button></div>
      ${filtresKids(S.envieKid, "envie-kid")}
      ${list.length ? `<div class="list" style="padding:0">${list.map(envieRow).join("")}</div>` : `<p class="empty">${tab === "achat" ? "Les produits repérés qu'on aime bien : un lien, un prix, pour qui. Pratique pour les cadeaux." : "Sorties, vacances, déco, projets : tout ce qu'on veut garder pour plus tard."} Colle un lien dans « Note tout ici » ou utilise le bouton ci-dessous.</p>`}
      <div class="actions"><button class="btn" data-act="form" data-type="lien">${tab === "achat" ? "Ajouter un achat" : "Ajouter une idée"}</button></div></div>`;
  },

  plus() {
    const nCheck = S.checklists.length;
    const s = statutSemaine(mondayOf(today()));
    const yi = anneeInfo(S.voiture === null && !S.releves.length ? 0 : anneeCourante());
    const lv = yi.empty ? "none" : yi.level;
    const soon = ["Projets et devis", "Budget et défis"];
    const sol = soldeFrais();
    const nbInfos = S.infos.length;
    return `<div class="sec" style="gap:14px"><h2>Plus</h2>
      <div class="tiles">
        <button class="tile lvl-${lv}" style="background:var(--lvbg)" data-act="sub" data-type="voiture"><b>Voiture</b><span>Kilométrage du leasing</span><span class="s"><b style="font-size:16px">${VERDICTS[lv]}</b>${yi.empty ? "" : `<br>${km(yi.used)} cette année`}</span></button>
        <button class="tile k-lyssia" style="background:var(--kbg)" data-act="sub" data-type="garde"><b>Garde de Lyssia</b><span class="s">${s ? (s.avec ? "Avec nous cette semaine" : "Sans Lyssia cette semaine") : "À configurer"}</span></button>
        <button class="tile c-lav" data-act="sub" data-type="infos"><b>Infos pratiques</b><span>Codes, mutuelle, contacts, tailles</span><span class="s">${nbInfos} info${nbInfos > 1 ? "s" : ""} enregistrée${nbInfos > 1 ? "s" : ""}</span></button>
        <button class="tile k-lyssia" style="background:var(--kbg)" data-act="sub" data-type="frais"><b>Frais de Lyssia</b><span>Partagés avec ${FLAVIE}</span><span class="s"><b style="font-size:16px">${soldeTxt(sol)}</b></span></button>
        <button class="tile c-yellow" data-act="sub" data-type="animaux"><b>Animaux</b><span>${S.animaux.map((a) => esc(a.nom)).join(", ") || "Véga et les chats"}</span><span class="s">${(() => { const c = S.animaux.map((a) => ({ a, c: croquettes(a) })).filter((x) => x.c).sort((x, y) => x.c.jours - y.c.jours)[0]; return c ? `Croquettes de ${esc(c.a.nom)} : ${c.c.jours <= 0 ? "à racheter" : "encore " + c.c.jours + " j"}` : "Croquettes, véto, consignes"; })()}</span></button>
        <button class="tile c-sage" data-act="sub" data-type="checklists"><b>Checklists</b><span class="s">${nCheck} modèle${nCheck > 1 ? "s" : ""}</span></button>
        <button class="tile" style="background:#2F8F3E;color:#fff" data-act="sub" data-type="poubelles"><b>Poubelles</b><span class="s">${(() => { const n = COLLECTES.find((c) => c.d >= today()); return n ? `Prochaine : ${SORTES[n.s].nom.toLowerCase()}, à sortir ${addDays(n.d, -1) === today() ? "ce soir" : fmt(addDays(n.d, -1)) + " soir"}` : "Calendrier à mettre à jour"; })()}</span></button>
        <button class="tile psg-hero" data-act="sub" data-type="psg"><b>Matchs du PSG</b><span class="s">${(() => { const n = MATCHS.find((m) => (m.au || m.date) >= today()); return n ? `Prochain : ${esc(n.adv)}, ${n.heure ? fmt(n.date) + " · " + fmtH(n.heure) : "à confirmer"}` : "Saison terminée"; })()}</span></button>
      </div>
      <h3>Prochainement</h3>
      <div class="tiles">${soon.map((x) => `<div class="tile soon"><b class="muted" style="font-size:17px">${x}</b><span class="muted small">À construire</span></div>`).join("")}</div>
      <div class="actions"><button class="btn ghost" data-act="export">Sauvegarder nos données</button><button class="btn ghost" data-act="logout">Se déconnecter (${esc(qui())})</button></div></div>`;
  },

  infos() {
    const q = sansAccent(S.infoQ).toLowerCase().trim();
    const match = (i) => !q || sansAccent(`${i.titre} ${i.valeur} ${i.note || ""} ${(i.pour || []).join(" ")}`).toLowerCase().includes(q);
    const sections = CAT_INFOS.map(([k, lib]) => {
      const items = S.infos.filter((i) => (i.cat || "autre") === k && match(i)).sort((a, b) => (a.titre || "").localeCompare(b.titre || ""));
      const deja = new Set(S.infos.map((i) => sansAccent(i.titre).toLowerCase()));
      const sugg = (SUGG_INFOS[k] || []).filter((x) => !deja.has(sansAccent(x).toLowerCase()));
      if ((q || !sugg.length) && !items.length) return "";
      return `<section class="sec"><div class="sec-head"><h3>${lib}</h3></div>
        ${items.length ? `<div class="list" style="padding:0">${items.map(infoRow).join("")}</div>` : ""}
        ${!q && sugg.length ? `<div class="sugg">${sugg.map((x) => `<button data-act="info-sugg" data-cat="${k}" data-t="${esc(x)}">+ ${esc(x)}</button>`).join("")}</div>` : ""}</section>`;
    }).join("");
    const tailles = ENFANTS.map((e) => {
      const f = S.fiches.find((x) => x.id === e.nom) || {};

        <span class="${mois != null && mois >= 6 ? "warn" : "muted"}">${f.maj ? (mois >= 6 ? `À vérifier (${mois} mois)` : `Mis à jour ${mois ? `il y a ${mois} mois` : "ce mois-ci"}`) : "À remplir"}</span></button>`;

        ${ouverts.length ? `<div class="actions"><button class="btn sm" data-act="frais-recap">Copier le récap pour ${FLAVIE}</button><button class="btn sm soft" data-act="frais-solde">${S.confirm === "solde" ? "Confirmer : tout est réglé" : "Tout est réglé"}</button></div>` : ""}</section>

      <section class="card c-white"><h2>Vétérinaire</h2>

      <section class="sec"><h2>Rappels de ${esc(a.nom)}</h2>${rap.length ? `<ul class="list">${rap.map(rappelRow).join("")}</ul>` : `<p class="empty">Aucun rappel. Vaccin, vermifuge, antipuce : crée un rappel qui contient « ${esc(a.nom)} » dans son titre, il apparaîtra ici.</p>`}
        <div class="actions"><button class="btn ghost" data-act="form" data-type="rappel">Nouveau rappel</button></div></section>

      <section class="card" style="background:#2F8F3E;color:#fff"><p class="big">Poubelles</p><p style="margin:0">La Ferté-Alais · on les sort la veille au soir. Elles apparaissent toutes seules sur l'accueil et dans l'agenda.</p></section>

      ${avenir.length ? `<ul class="list">${avenir.map((m) => `<li class="row"><span class="bubble psg">${m.heure ? fmtH(m.heure).replace(" h ", " h<br>") : "À<br>conf."}</span>
        <div class="grow"><div class="t">PSG – ${esc(m.adv)}</div><div class="m"><span>${m.heure ? fmt(m.date) : `week-end du ${fmtCourt(m.date)} au ${fmtCourt(m.au)}`}</span><span>${esc(m.comp)}</span></div></div></li>`).join("")}</ul>` : '<p class="empty">Plus de match à domicile prévu cette saison.</p>'}

  checklists() {
    return `<div class="sec" style="gap:14px">${back()}<h2>Checklists</h2>
      ${S.checklists.length ? `<ul class="list">${S.checklists.slice().sort((a, b) => (a.nom || "").localeCompare(b.nom || "")).map((c) => {
        const it = c.items || [], ok = it.filter((i) => i.ok).length;
        return `<li class="row ${kidCls(c) || (/lyssia/i.test(c.nom) ? "k-lyssia" : "")}"><span class="bubble">${ok}/${it.length}</span><button class="grow" data-act="open-check" data-id="${c.id}"><div class="t">${esc(c.nom)}</div><div class="m">${kidTags(c)}<span>${ok} coché${ok > 1 ? "s" : ""}</span></div></button></li>`;

      <div class="actions"><button class="btn" data-act="form" data-type="checklist">Nouvelle checklist</button></div></div>`;
  },

  checklist() {
    const c = S.checklists.find((x) => x.id === S.sub.id);
    if (!c) return `<div class="sec">${back()}<p class="empty">Cette checklist n'existe plus.</p></div>`;

      ${it.length ? `<ul class="list">${it.map((i, k) => `<li class="row"><button class="tick ${i.ok ? "on" : ""}" data-act="check-item" data-k="${k}" aria-label="${i.ok ? "Décocher" : "Cocher"} ${esc(i.t)}">${i.ok ? CHECK : ""}</button><span class="grow ${i.ok ? "muted" : ""}">${esc(i.t)}</span><button class="btn sm ghost" data-act="check-to-courses" data-k="${k}" title="Ajouter aux courses urgentes">Courses</button><button class="x" data-act="check-del" data-k="${k}" aria-label="Retirer ${esc(i.t)}">×</button></li>`).join("")}</ul>` : '<p class="empty">Ajoute le premier élément.</p>'}
      <form class="quick" data-form="check-add" autocomplete="off"><input type="text" id="ck-add" name="t" placeholder="Ajouter un élément" aria-label="Nouvel élément"><button class="btn" type="submit">Ajouter</button></form>
      <div class="actions"><button class="btn ghost" data-act="check-reset">Tout décocher pour la prochaine fois</button>
      <button class="btn danger" data-act="del" data-col="checklists" data-id="${c.id}">${S.confirm === c.id ? "Confirmer la suppression" : "Supprimer"}</button></div></div>`;

  garde() {
    const g = S.garde || {}; const lun0 = mondayOf(today());
    let weeks = "";
    for (let w = 0; w < 12; w++) {
      const m = addDays(lun0, 7 * w), s = statutSemaine(m);
      weeks += `<li class="row"><span class="grow">Semaine du ${fmt(m)}</span>${s ? `<span class="pill ${s.avec ? "avec" : "sans"}">${s.avec ? "Avec Lyssia" : "Sans"}</span>` : ""}${s && s.motif !== "Alternance" ? `<span class="muted small">${esc(s.motif)}</span>` : ""}</li>`;
    }
    const ex = S.exceptions.slice().sort((a, b) => (a.du || "").localeCompare(b.du || ""));
    return `<div class="sec" style="gap:14px">${back()}
      <div class="garde avec"><p class="tagline">Lyssia</p><p class="big">Garde alternée</p><p>Une semaine sur deux, du lundi ${heurePassage()} au lundi suivant. Les vacances et les échanges se gèrent avec des exceptions.</p></div>
      <form class="form" data-form="garde-cfg">
        <div class="two"><label class="f">Un lundi où elle arrive<input type="date" id="g-ancre" name="ancre" value="${esc(g.ancre || "")}" required></label>
        <label class="f">Heure de passage<input type="time" id="g-heure" name="heure" value="${esc(g.heure || "16:40")}"></label></div>
        <div class="actions"><button class="btn sm" type="submit">Enregistrer la règle</button></div>
      </form>
      <h3>Les 12 prochaines semaines</h3><ul class="list">${weeks}</ul>
      <h3>Exceptions</h3>
      ${ex.length ? `<ul class="list">${ex.map((e) => `<li class="row"><div class="grow"><div class="t">${fmt(e.du)} → ${fmt(e.au)}</div><div class="m"><span class="pill ${e.avec ? "avec" : "sans"}">${e.avec ? "Avec" : "Sans"}</span><span>${esc(e.motif || "")}</span></div></div><button class="x" data-act="del" data-col="exceptions" data-id="${e.id}" aria-label="Supprimer">${S.confirm === e.id ? "✓" : "×"}</button></li>`).join("")}</ul>` : '<p class="empty">Aucune exception.</p>'}
      <div class="actions"><button class="btn" data-act="form" data-type="exception">Ajouter une exception</button></div></div>`;
  },

  voiture() {
    const c = cfgV();
    const cy = anneeCourante(); if (S.kmYear == null) S.kmYear = cy;
    const yi = anneeInfo(S.kmYear);
    const lv = yi.empty ? "none" : yi.level;
    const A = c.allowance, end = fmtAn(yi.yEnd);
    let verdict = VERDICTS[lv], lead = "", notes = [], action = "";
    if (yi.empty) {
      verdict = yi.state === "future" ? "Pas encore commencée" : "Aucun relevé";
      lead = yi.state === "future" ? `Cette année de contrat démarre le ${fmtAn(yi.ys)}.` : "Saisis le compteur du jour pour lancer le suivi de cette année.";
    } else if (yi.state === "past" && yi.elapsed === yi.yearDays) {
      verdict = yi.used <= A ? "Année validée" : "Année dépassée";
      lead = `${km(yi.used)} sur ${km(A)}, ` + (yi.used <= A ? `soit ${km(A - yi.used)} de marge.` : `soit ${km(yi.used - A)} de trop.`);
    } else if (yi.proj == null) {
      verdict = "Premier relevé"; lead = "Il faut au moins un jour d'écart pour calculer un rythme.";
    } else {
      lead = lv === "ok" ? `À ce rythme, on finit l'année à ${km(yi.proj)} le ${end}, soit ${km(A - yi.proj)} de marge.`
        : lv === "warn" ? `À ce rythme, on finit l'année à ${km(yi.proj)} le ${end}. Il reste seulement ${km(A - yi.proj)} de marge pour les imprévus.`
        : `À ce rythme, on finit l'année à ${km(yi.proj)} le ${end}, soit ${km(yi.proj - A)} de trop.`;
      if (yi.elapsed < 30) notes.push("Moins d'un mois de données : la projection va encore bouger.");
      const age = diffDays(yi.last.date, today());
      if (yi.state === "current" && age >= 10) notes.push(`Dernier relevé il y a ${age} jours, pense à en saisir un.`);
      if (yi.recentPace != null && niveau(yi.recentProj) !== lv) notes.push(`Depuis le ${fmtCourt(yi.recentFrom)}, le rythme est de ${nb(yi.recentPace)} km/jour : s'il continue, ce serait ${km(yi.recentProj)} en fin d'année.`);
      if (yi.daysLeft > 0) {
        if (lv === "ok") action = `<p>Budget restant jusqu'au ${end} : <b>${km(yi.perDay * 7)} par semaine</b> en moyenne (${nb(yi.perDay)} km/jour, week-ends compris).</p>`;
        else {
          const target = A - c.marge, toSave = Math.max(0, yi.proj - target), tw = (target - yi.used) / yi.daysLeft * 7;
          action = tw > 0 ? `<p>Pour retrouver ${km(c.marge)} de marge, il faut rester sous <b>${km(tw)} par semaine</b> d'ici le ${end}.</p>` : `<p>La marge est déjà consommée : chaque km compte jusqu'au ${end}.</p>`;
          let parts = `Ça représente environ ${km(toSave)} à économiser`;
          const m = Number(c.medhi), ch = Number(c.chloe);
          if (m > 0) parts += `, soit ${nb(Math.ceil(toSave / m))} jours de trajet de Medhi`;
          if (m > 0 && c.chloe != null && c.chloe !== "" && m - ch > 0) parts += `, ou ${nb(Math.ceil(toSave / (m - ch)))} jours où vous échangez les voitures`;
          action += `<p>${parts}.</p>`;
        }
      }
    }
    // Jauge
    const max = A * 1.15, pct = (v) => Math.max(0, Math.min(100, v / max * 100));
    const gauge = yi.empty ? "" : `<div class="gauge" role="img" aria-label="Parcouru ${km(yi.used)} sur ${km(A)}">
      <div class="fp" style="width:${pct(yi.proj ?? yi.used)}%"></div><div class="fu" style="width:${pct(yi.used)}%"></div>
      ${yi.elapsed < yi.yearDays ? `<div class="tk" style="left:${pct(yi.budget)}%"></div>` : ""}<div class="cap" style="left:${pct(A)}%"></div></div>
      <ul class="legend"><li><span class="sw" style="background:var(--ink)"></span>Parcouru <b>${km(yi.used)}</b></li>
      ${yi.elapsed < yi.yearDays && yi.proj != null ? `<li><span class="sw" style="background:var(--lv);opacity:.5"></span>Fin d'année à ce rythme <b>${km(yi.proj)}</b></li>` : ""}
      <li><span class="sw" style="background:var(--hot);width:3px"></span>Plafond ${km(A)}</li></ul>`;
    const figs = yi.empty ? "" : `<div class="figs">
      <div class="fig"><div class="v">${nb(yi.used)}</div><div class="l">km parcourus depuis le ${fmtCourt(yi.ys)}</div></div>
      <div class="fig"><div class="v">${nb(yi.budget)}</div><div class="l">km prévus à date</div>${yi.elapsed < yi.yearDays ? `<div class="s" style="color:${yi.gap > 0 ? "var(--hot)" : "var(--ok)"}">${yi.gap > 0 ? "+" + nb(yi.gap) + " km d'avance" : nb(-yi.gap) + " km sous le budget"}</div>` : ""}</div>
      <div class="fig"><div class="v">${nb(yi.remaining)}</div><div class="l">km restants sur ${nb(A)}</div></div>
      <div class="fig"><div class="v">${yi.perDay != null ? nb(yi.perDay * 7) : "—"}</div><div class="l">km max par semaine à partir de maintenant</div></div></div>`;
    // Historique
    const sorted = S.releves.slice().sort((a, b) => b.date.localeCompare(a.date));
    const chrono = kmPoints();
    const hist = sorted.length ? `<ul class="list">${(S.kmAll ? sorted : sorted.slice(0, 6)).map((r) => {
      const idx = chrono.findIndex((p) => p.date === r.date && !p.virtual); const prev = idx > 0 ? chrono[idx - 1] : null;
      const nd = prev ? diffDays(prev.date, r.date) : 0;
      return `<li class="row"><div class="grow"><div class="t">${fmtAn(r.date)}</div>${prev ? `<div class="m">+${km(r.km - prev.km)} en ${nd} j${nd > 0 ? ` (${nb((r.km - prev.km) / nd)} km/j)` : ""}</div>` : ""}</div>

const back = () => `<div><button class="link" data-act="back">← Retour</button></div>`;

function kmChart(yi) {
  const A = cfgV().allowance;
  const W = 360, H = 210, pl = 34, pr = 10, pt = 14, pb = 26;
  const ymax = Math.max(A * 1.1, (yi.proj || 0) * 1.05);
  const x = (d) => pl + (W - pl - pr) * d / yi.yearDays, y = (v) => H - pb - (H - pt - pb) * v / ymax;
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Kilomètres cumulés comparés au budget">`;
  for (let v = 0; v <= ymax; v += 10000) s += `<line x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pl - 6}" y="${y(v) + 4}" text-anchor="end">${v ? v / 1000 + "k" : "0"}</text>`;
  s += `<line x1="${pl}" x2="${W - pr}" y1="${y(A)}" y2="${y(A)}" stroke="var(--hot)" stroke-width="1.5"/><text x="${W - pr}" y="${y(A) - 5}" text-anchor="end" style="fill:var(--hot)">Plafond ${nb(A)}</text>`;
  for (let mth = 0; mth <= 12; mth += 3) {
    const [yy, mm, dd0] = yi.ys.split("-").map(Number); const ds = iso(new Date(yy, mm - 1 + mth, dd0));
    const d = Math.min(diffDays(yi.ys, ds), yi.yearDays);
    s += `<text x="${x(d)}" y="${H - 8}" text-anchor="${mth === 0 ? "start" : mth === 12 ? "end" : "middle"}">${MC[parse(ds).getMonth()]}</text>`;
  }
  s += `<line x1="${x(0)}" y1="${y(0)}" x2="${x(yi.yearDays)}" y2="${y(A)}" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="4 5"/>`;
  const lp = yi.series[yi.series.length - 1];
  const col = `var(--${yi.level === "warn" ? "warn" : yi.level === "hot" ? "hot" : "ok"})`;
  if (yi.proj != null && yi.elapsed < yi.yearDays) s += `<line x1="${x(lp.d)}" y1="${y(lp.v)}" x2="${x(yi.yearDays)}" y2="${y(yi.proj)}" stroke="${col}" stroke-width="2.5" stroke-dasharray="7 6"/><circle cx="${x(yi.yearDays)}" cy="${y(yi.proj)}" r="4.5" fill="${col}"/>`;
  s += `<path d="${yi.series.map((p, i) => (i ? "L" : "M") + x(p.d).toFixed(1) + " " + y(p.v).toFixed(1)).join(" ")}" fill="none" stroke="var(--ink)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`;
  yi.series.slice(1).forEach((p) => { s += `<circle cx="${x(p.d)}" cy="${y(p.v)}" r="3.5" fill="var(--ink)"/>`; });
  s += `</svg><ul class="legend"><li><span class="sw" style="background:var(--ink)"></span>Réel</li><li><span class="sw" style="border-top:2px dashed var(--muted);height:0;width:16px;border-radius:0"></span>Rythme idéal (${nb(A / yi.yearDays)} km/jour)</li>${yi.proj != null && yi.elapsed < yi.yearDays ? `<li><span class="sw" style="border-top:2px dashed ${col};height:0;width:16px;border-radius:0"></span>Projection</li>` : ""}</ul>`;
  return s;
}

    ${p.type === "tache" ? `<div class="chips">${QUI.map((q) => `<label><input type="radio" name="${prefix}${i}-qui" value="${q}" data-prop="${i}" data-field="qui" ${(p.qui || "Les deux") === q ? "checked" : ""}><span>${q}</span></label>`).join("")}</div>` : ""}
    ${p.type !== "course" && p.type !== "tard" && p.type !== "tache" ? `<div class="chips">${ENFANTS.map((e) => `<label class="${e.cls}"><input type="checkbox" data-prop="${i}" data-pour="${e.nom}" ${(p.pour || []).includes(e.nom) ? "checked" : ""}><span>${e.nom}</span></label>`).join("")}</div>` : ""}
  </div>`).join("");
}
function hintTxt() {
  if (!props.length) return "";
  const dests = [...new Set(props.map((p) => DEST[p.type]))];
  return `${props.length} élément${props.length > 1 ? "s" : ""} → ${dests.join(", ")}`;
}
function renderVrac() {
  for (const [box, prefix] of [["#vrac-preview", "v"], ["#vrac-preview-s", "s"]]) { const el = $(box); if (el) el.innerHTML = vracPropsHTML(prefix); }
  for (const [foot, hint] of [["#vrac-foot", "#vrac-hint"], ["#vrac-foot-s", "#vrac-hint-s"]]) {
    const f = $(foot); if (f) f.hidden = !props.length;
    const h = $(hint); if (h) h.textContent = hintTxt();
  }
}
function onVracInput(el) {
  el.style.height = "auto"; el.style.height = Math.min(el.scrollHeight, 220) + "px";
  props = classerTout(el.value).map((p) => {
    const txt = sansAccent(p.titre || "").toLowerCase();
    if (/\brentr\w*\s+(un peu\s+|tres\s+)?tard\b|\bcouche[rs]?\s+les enfants\b/.test(txt)) {
      return { ...p, type: "tard", date: p.date || today(), qui: /\bmedhi\s+rentre/.test(txt) ? "Medhi" : /\bchloe\s+rentre/.test(txt) ? "Chloé" : qui() };
    }
    return { ...p, pour: enfantsDans(p.titre || ""), genre: p.type === "lien" ? "achat" : undefined };
  });
  renderVrac();
}
async function saveVrac() {
  const keep = props.filter((p) => (p.titre || p.url || "").trim());
  if (!keep.length) return;
  const t = today(); const me = qui(); const hint = hintTxt();
  const ok = await W(async () => {
    const b = writeBatch(fs);
    for (const p of keep) {
      const titre = (p.titre || "").trim(); const pour = p.pour || [];
      if (p.type === "course") b.set(doc(collection(fs, "courses")), { nom: titre, liste: p.liste || "urgent", note: "", qui: me, cree: now() });
      else if (p.type === "tache") b.set(doc(collection(fs, "taches")), { titre, qui: p.qui || "Les deux", note: "", pour, fait: false, par: me, cree: now() });
      else if (p.type === "tard") { const q = p.qui || me; b.set(doc(collection(fs, "events")), { type: "tard", titre: `${q} rentre tard`, date: p.date || t, heure: p.heure || "", qui: q, note: "", pour: [], par: me, cree: now() }); }
      else if (p.type === "evenement") b.set(doc(collection(fs, "events")), { titre, date: p.date || t, heure: p.heure || "", note: "", pour, qui: "Les deux", par: me, cree: now() });
      else if (p.type === "rappel") b.set(doc(collection(fs, "rappels")), { titre, prochaine: p.date || t, cat: "Autre", recur: null, note: p.heure ? `à ${fmtH(p.heure)}` : "", pour, qui: me, histo: [], termine: false, cree: now() });
      else b.set(doc(collection(fs, "liens")), { url: p.url || (/^https?:/.test(titre) ? titre : ""), titre: p.url ? titre : (/^https?:/.test(titre) ? "" : titre), genre: p.genre || "achat", pour, tag: "", note: "", prix: "", statut: "À voir", par: me, cree: now() });
    }
    await b.commit();
  }, `Rangé : ${hint.split("→ ")[1] || ""}`);
  if (ok) {
    props = [];
    for (const id of ["#vrac", "#vrac-s"]) { const el = $(id); if (el) { el.value = ""; el.style.height = ""; } }
    renderVrac(); closeSheet();
  }
}

/* ---------- Écritures ---------- */
function errMsg(e) {
  if (e?.code === "permission-denied") return "Accès refusé : reconnecte-toi.";
  if (e?.code === "resource-exhausted") return "Quota gratuit du jour atteint : réessaie demain.";
  return "Enregistrement impossible pour l'instant. Réessaie.";
}
// Hors réseau, Firebase garde l'écriture sur le téléphone et la confirme plus tard :
// on n'attend donc pas plus d'une seconde et demie avant de rendre la main.
async function W(fn, ok, undo) {
  let failed = null;
  const p = Promise.resolve().then(fn).catch((e) => { failed = e; toast(errMsg(e)); });
  await Promise.race([p, sleep(1500)]);
  if (failed) return false;
  if (ok) toast(ok, undo);
  return true;
}
const col = (k) => {
  const path = COLS[k] || k; const c = collection(fs, path);
  return {
    add: (data) => addDoc(c, data),
    doc: (id) => { const r = doc(fs, path, id); return { update: (d) => updateDoc(r, d), set: (d) => setDoc(r, d), delete: () => deleteDoc(r) }; },
  };
};
const now = () => new Date().toISOString();
let toastTimer = null;
function toast(msg, undo) {
  clearTimeout(toastTimer);
  $("#toast-root").innerHTML = `<div class="toast" role="status"><span>${esc(msg)}</span>${undo ? '<button data-act="undo">Annuler</button>' : ""}</div>`;
  S.undo = undo || null;
  toastTimer = setTimeout(() => { $("#toast-root").innerHTML = ""; S.undo = null; }, undo ? 6000 : 3000);
}
function addFrequent(nom) {
  const n = nom.trim(); if (!n) return;
  const list = [n, ...S.frequents.filter((f) => f.toLowerCase() !== n.toLowerCase())].slice(0, 80);
  setDoc(doc(fs, "config", "frequents"), { noms: list }).catch(() => {});
}
async function exporter() {
  const data = { exporte: now(), garde: S.garde, voiture: S.voiture, releves: S.releves };
  for (const k of Object.keys(COLS)) data[k] = S[k];
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const name = `qg-famille-${today()}.json`;
  const file = new File([blob], name, { type: "application/json" });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: "Sauvegarde QG Famille" }); return; } catch (e) { if (e.name === "AbortError") return; }
  }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
const kmMsg = (txt, cls) => { const m = $("#km-msg"); if (m) { m.textContent = txt; m.className = "msg " + (cls || ""); } };

  exception: async (fd) => {
    let du = fd.get("du"), au = fd.get("au"); if (au < du) [du, au] = [au, du];
    closeSheet(); await W(() => col("exceptions").add({ du, au, avec: fd.get("avec") === "1", motif: String(fd.get("motif") || "") }), "Exception ajoutée");
  },
  "garde-cfg": async (fd) => {
    const ancre = fd.get("ancre"); if (!ancre) return;
    await W(() => setDoc(doc(fs, "config", "garde"), { ancre: mondayOf(ancre), heure: fd.get("heure") || "16:40" }), "Règle enregistrée");
  },
  "km-add": async (fd) => {
    const c = cfgV(); const date = fd.get("date"); const raw = String(fd.get("km") || "").replace(/\s/g, ""); let v = Number(raw);
    if (!isDate(date)) return kmMsg("Choisis une date.", "err");
    if (date > today()) return kmMsg("La date ne peut pas être dans le futur.", "err");
    if (date < c.start) return kmMsg(`La date est antérieure au début du contrat (${fmtAn(c.start)}).`, "err");
    if (!raw || !isFinite(v) || v < 0) return kmMsg("Indique le compteur en km.", "err");
    v = Math.round(v);
    const others = S.releves.filter((r) => r.date !== date);
    const before = others.filter((r) => r.date < date).sort((a, b) => b.date.localeCompare(a.date))[0];
    const after = others.filter((r) => r.date > date).sort((a, b) => a.date.localeCompare(b.date))[0];
    if (v < (Number(c.kmDepart) || 0)) return kmMsg(`Le compteur est inférieur au kilométrage à la livraison (${km(c.kmDepart)}).`, "err");
    if (before && v < before.km) return kmMsg(`Le compteur était déjà à ${km(before.km)} le ${fmtAn(before.date)}. Vérifie le chiffre.`, "err");
    if (after && v > after.km) return kmMsg(`Le relevé du ${fmtAn(after.date)} indique ${km(after.km)}, c'est moins que ce chiffre.`, "err");
    const replacing = S.releves.some((r) => r.date === date);
    S.kmYear = null;
    await W(() => setDoc(doc(fs, "voiture_releves", date), { km: v, savedAt: Date.now() }), replacing ? `Relevé du ${fmtAn(date)} mis à jour` : `Relevé enregistré : ${km(v)}`);
  },
  "km-import": async (fd) => {
    const lignes = String(fd.get("t") || "").split(/\n+/).map((l) => l.trim()).filter(Boolean);
    const out = [];
    for (const l of lignes) {
      const m = l.match(/(\d{4}-\d{2}-\d{2}|\d{1,2}\/\d{1,2}\/\d{4})\D+([\d\s. ]+)/);
      if (!m) continue;
      let d = m[1]; if (d.includes("/")) { const [j, mo, y] = d.split("/"); d = `${y}-${pad(mo)}-${pad(j)}`; }
      const v = Number(m[2].replace(/[\s. ]/g, ""));
      if (isDate(d) && isFinite(v)) out.push({ d, v });
    }
    if (!out.length) { toast("Aucune ligne reconnue : date puis kilométrage, une par ligne."); return; }
    await W(async () => { const b = writeBatch(fs); for (const r of out) b.set(doc(fs, "voiture_releves", r.d), { km: r.v, savedAt: Date.now() }); await b.commit(); }, `${out.length} relevé${out.length > 1 ? "s" : ""} importé${out.length > 1 ? "s" : ""}`);
  },
  "km-cfg": async (fd) => {
    const m = $("#v-msg");
    const next = {
      start: fd.get("start"), allowance: Math.round(Number(fd.get("allowance"))), kmDepart: Math.round(Number(fd.get("kmDepart")) || 0),
      marge: Math.round(Number(fd.get("marge")) || 0), medhi: Math.round(Number(fd.get("medhi")) || 0),
      chloe: fd.get("chloe") === "" ? null : Math.round(Number(fd.get("chloe"))),
    };
    if (!isDate(next.start)) { m.className = "msg err"; m.textContent = "Date de début invalide."; return; }
    if (!(next.allowance > 0)) { m.className = "msg err"; m.textContent = "Le nombre de km par an doit être positif."; return; }
    if (next.marge >= next.allowance) { m.className = "msg err"; m.textContent = "La marge doit être inférieure au nombre de km par an."; return; }
    S.kmYear = null;
    await W(() => setDoc(doc(fs, "config", "voiture"), next), "Réglages enregistrés");
  },
};

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  if (e.target.closest("a")) return;
  const fn = ACT[el.dataset.act]; if (!fn) return;
  e.preventDefault(); fn(el.dataset, el, e);
});
document.addEventListener("submit", (e) => {
  const f = e.target; const fn = SUBMIT[f.dataset.form]; if (!fn) return;
  e.preventDefault(); fn(new FormData(f), f);
});
document.addEventListener("change", async (e) => {
  const el = e.target;
  if (el.dataset.chg === "lien-statut") await W(() => col("liens").doc(el.dataset.id).update({ statut: el.value }), "Statut mis à jour");
  if (el.dataset.prop !== undefined) {
    const p = props[Number(el.dataset.prop)]; if (!p) return;
    if (el.dataset.pour) { const set = new Set(p.pour || []); el.checked ? set.add(el.dataset.pour) : set.delete(el.dataset.pour); p.pour = [...set]; return; }
    p[el.dataset.field] = el.value;
    if (el.dataset.field === "type") { if (p.type === "lien") { if (!p.url && /^https?:/.test(p.titre)) p.url = p.titre; p.genre = p.genre || "achat"; } renderVrac(); }
  }
});
document.addEventListener("input", (e) => {
  const el = e.target;
  if (el.id === "vrac" || el.id === "vrac-s") { onVracInput(el); return; }
  if (el.id === "info-q") { S.infoQ = el.value; render(); return; }
  if (el.dataset.prop !== undefined && el.dataset.field && el.dataset.field !== "type" && el.type !== "radio") { const p = props[Number(el.dataset.prop)]; if (p) p[el.dataset.field] = el.value; }
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && $("#sheet-root").innerHTML) closeSheet();
  if ((e.target.id === "vrac" || e.target.id === "vrac-s") && e.key === "Enter" && !e.shiftKey) { e.preventDefault(); saveVrac(); }
  if ((e.key === "Enter" || e.key === " ") && e.target.getAttribute("role") === "button") { e.preventDefault(); e.target.click(); }
});
addEventListener("online", () => { S.offline = false; renderStatus(); });
addEventListener("offline", () => { S.offline = true; renderStatus(); });
document.addEventListener("visibilitychange", () => { if (!document.hidden && $("#app").hidden === false) render(); });

/* ---------- Premier lancement : règle de garde 2026-2027 ---------- */
async function premierLancement() {
  const b = writeBatch(fs);
  b.set(doc(fs, "config", "garde"), { ancre: "2026-09-14", heure: "16:40" });
  b.set(doc(fs, "garde_exceptions", "toussaint-2026-s1"), { du: "2026-10-19", au: "2026-10-25", avec: true, motif: "Toussaint, 1re semaine" });
  b.set(doc(fs, "garde_exceptions", "toussaint-2026-s2"), { du: "2026-10-26", au: "2026-11-08", avec: false, motif: "Toussaint, 2e semaine" });
  b.set(doc(fs, "garde_exceptions", "ete-2027-juillet"), { du: "2027-07-01", au: "2027-07-31", avec: false, motif: "Été 2027 : juillet chez l'autre parent" });
  b.set(doc(fs, "garde_exceptions", "ete-2027-aout"), { du: "2027-08-01", au: "2027-08-31", avec: true, motif: "Été 2027 : août avec nous" });
  b.set(doc(fs, "checklists", "sac-lyssia"), { nom: "Sac de Lyssia", pour: ["Lyssia"], items: ["Cahiers et trousse", "Affaires de sport", "Doudou", "Médicaments en cours", "Chargeur"].map((t) => ({ t, ok: false })), cree: now() });
  b.set(doc(fs, "rappels", "verif-garde-2027"), { titre: "Vérifier la règle de garde (petites vacances, été)", prochaine: "2027-09-01", cat: "Administratif", recur: { n: 1, unite: "an" }, pour: ["Lyssia"], qui: "Chloé", note: "Les semaines de petites vacances s'inversent-elles ? Mettre à jour les exceptions.", histo: [], termine: false, cree: now() });
  await b.commit();
}

/* ---------- Connexion et démarrage ---------- */
function ecouter() {
  S.garde = undefined;
  for (const [k, path] of Object.entries(COLS)) {
    S.unsub.push(onSnapshot(collection(fs, path), (snap) => {
      S[k] = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      if (!snap.metadata.fromCache || S[k].length) S.loaded.add(k);
      render();
    }, (e) => { if (e.code === "permission-denied") toast("Accès refusé à cette base."); }));
  }
  S.unsub.push(onSnapshot(collection(fs, "voiture_releves"), (snap) => {
    S.releves = snap.docs.map((d) => ({ date: d.id, km: Number(d.data().km) })).filter((r) => isDate(r.date) && isFinite(r.km));
    render();
  }, () => {}));
  S.unsub.push(onSnapshot(doc(fs, "config", "voiture"), (s) => { S.voiture = s.exists() ? s.data() : null; render(); }, () => {}));
  S.unsub.push(onSnapshot(doc(fs, "config", "ajouts"), (s) => {
    if (s.metadata.fromCache) return;
    const fait = s.exists() ? s.data() : {};
    if (!fait.paieNounou) {
      const b = writeBatch(fs);
      b.set(doc(fs, "rappels", "paie-nounou"), { titre: "Faire la paie de la nounou (Pajemploi)", prochaine: "2026-11-25", cat: "Administratif", recur: { n: 1, unite: "mois", fixe: true, jour: 25 }, pour: [], qui: "Chloé", note: "Déclaration Pajemploi entre le 25 et le 5 du mois suivant", histo: [], termine: false, cree: now() });
      b.set(doc(fs, "config", "ajouts"), { ...fait, paieNounou: true });
      b.commit().catch(() => {});
    }
  }, () => {}));
  S.unsub.push(onSnapshot(collection(fs, "animaux"), (snap) => {
    if (!snap.metadata.fromCache && snap.empty) setDoc(doc(fs, "animaux", "vega"), { nom: "Véga", espece: "Chien", croq: {}, veto: {}, cree: now() }).catch(() => {});
  }, () => {}));
  S.unsub.push(onSnapshot(doc(fs, "config", "garde"), (s) => {
    S.garde = s.exists() ? s.data() : null;
    if (!s.exists() && !s.metadata.fromCache) premierLancement().catch(() => {});
    render();
  }, () => {}));
  S.unsub.push(onSnapshot(doc(fs, "config", "frequents"), (s) => { S.frequents = s.exists() && Array.isArray(s.data().noms) ? s.data().noms : []; }, () => {}));
}

onAuthStateChanged(auth, (u) => {
  S.unsub.forEach((f) => f()); S.unsub = [];
  if (u && PERSONNES[u.uid]) {
    S.me = PERSONNES[u.uid];
    $("#login").hidden = true; $("#app").hidden = false;
    ecouter(); render();
  } else {
    if (u) signOut(auth);
    S.me = "";
    $("#app").hidden = true; $("#login").hidden = false;
  }
});

$("#login-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const err = $("#l-err"); const go = $("#l-go");
  err.textContent = ""; go.disabled = true;
  try { await signInWithEmailAndPassword(auth, $("#l-email").value.trim(), $("#l-pass").value); }
  catch (x) {
    err.textContent = {
      "auth/invalid-credential": "E-mail ou mot de passe incorrect.",
      "auth/invalid-email": "Cette adresse e-mail n'est pas valide.",
      "auth/too-many-requests": "Trop d'essais. Attends quelques minutes ou utilise « Mot de passe oublié ».",
      "auth/network-request-failed": "Pas de réseau. Vérifie ta connexion puis réessaie.",
    }[x.code] || "Connexion impossible. Réessaie.";
  } finally { go.disabled = false; }
});
$("#l-forgot").addEventListener("click", async () => {
  const email = $("#l-email").value.trim(); const err = $("#l-err");
  if (!email) { err.textContent = "Tape d'abord ton e-mail, puis appuie sur « Mot de passe oublié »."; return; }
  try { await sendPasswordResetEmail(auth, email); err.textContent = "Si ce compte existe, un e-mail de réinitialisation vient d'être envoyé."; }
  catch { err.textContent = "Envoi impossible pour l'instant. Réessaie."; }
});
